version: "2"
sql:
  - engine: "postgresql"
    queries: "queries.sql"
    schema: "init.sql"
    gen:
      go:
        package: "dbgen"
        out: "generated"
        emit_db_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
